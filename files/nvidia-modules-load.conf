# Load the NVIDIA modules explicitly, in dependency order, at boot.
# Baked into /usr/lib/modules-load.d so it survives a `bootc switch`
# (see the COPY in the Containerfile).
#
# Without this, the only thing pulling the modules in is the
# `nvidia-drm.modeset=1` kernel command-line argument in
# files/nvidia-kargs.toml: the kernel's unknown_bootoption() path turns
# a `module.param=value` it doesn't recognise into
# request_module("nvidia-drm.modeset=1"), which modprobes nvidia-drm
# and lets kmod resolve `nvidia-modeset` and `nvidia` from its
# depends=. That works, but it is an indirect mechanism with two
# consequences we don't want:
#
#   - Ordering is only as good as nvidia-drm.ko's depends= list, which
#     is not the driver's intended load order. nouveau and the
#     proprietary driver race for the same PCI device; whichever binds
#     first wins and the other never probes the hardware.
#   - nvidia-uvm has no reason to be loaded at all under that path, so
#     /dev/nvidia-uvm never appears and CUDA/compute is unavailable
#     even though the module is installed.
#
# Same list and same rationale as projectbluefin/dakota's
# nvidia-modprobe-config.bst ("Order matters: nvidia -> nvidia-modeset
# -> nvidia-drm. Loading early so we grab the framebuffer before any
# other DRM driver tries"). Bazzite/Bluefin reach the same end via
# dracut's force_drivers instead of modules-load.d, with the same
# hybrid caveat spelled out in their nvidia-install.sh: they force
# `i915 amdgpu` to load *before* nvidia, "else chromium web browsers
# fail to use hardware acceleration" — see README.md,
# "Known limitations", for why that caveat is weaker here.
nvidia
nvidia-modeset
nvidia-drm
nvidia-uvm
