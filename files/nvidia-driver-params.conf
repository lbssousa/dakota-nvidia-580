# Module options for the proprietary NVIDIA driver, applied at
# nvidia.ko / nvidia-drm.ko load time. Baked into the image under
# /usr/lib/modprobe.d (see the COPY in the Containerfile) rather than
# /etc, so it survives a `bootc switch` without depending on the /etc
# 3-way merge — same reasoning as files/nvidia-blacklist-nouveau.conf.
#
# Ported from projectbluefin/dakota's
# elements/bluefin-nvidia/nvidia-modprobe-config.bst, which is the
# same content negativo17's nvidia-kmod-common RPM ships as
# /usr/lib/modprobe.d/nvidia.conf — i.e. this is what Bazzite, Bluefin
# and BlueBuild all end up with, since they install that RPM.
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_OpenRmEnableUnsupportedGpus=0
options nvidia NVreg_EnableGpuFirmware=1

# LOAD-BEARING for suspend/hibernate, not just power saving: without
# these two the nvidia-suspend/hibernate/resume units have nothing to
# talk to, GPU context is lost on resume (hard lock), and the driver
# vetoes kernel PM outright (nv_pmops_suspend returns -5) so the
# machine cannot sleep at all. The units that consume these live in the
# NVIDIA payload; scripts/build-nvidia.sh installs them and fails the
# build if any is missing. See README.md, "Module load order and
# suspend/resume" and "Why the graphical environment needs
# nvidia-modprobe".
options nvidia NVreg_PreserveVideoMemoryAllocations=1
# Default is /tmp, which is tmpfs on this image — that would page the
# GPU's entire VRAM into RAM on every suspend. /var/tmp is real disk.
options nvidia NVreg_TemporaryFilePath=/var/tmp
