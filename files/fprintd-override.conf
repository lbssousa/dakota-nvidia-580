# LD_LIBRARY_PATH aponta pro libfprint do fork (Goodix 538d), instalado
# em /usr/local/lib64 durante o BUILD da imagem (image/Containerfile).
#
# Diferente de playbooks/dakota/libfprint.yml (que instala em runtime e
# por isso precisa do workaround /var/usrlocal, já que /usr/local não é
# gravável num sistema Dakota já implantado): aqui não tem workaround
# nenhum, porque /usr/local é escrito durante o build da imagem, antes
# do composefs virar somente-leitura — /usr/local vira parte normal da
# imagem, como qualquer outro caminho abaixo de /usr.
[Service]
Environment=LD_LIBRARY_PATH=/usr/local/lib64
