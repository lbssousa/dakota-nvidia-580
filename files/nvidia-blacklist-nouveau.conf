# Evita que o nouveau (driver open-source in-tree) reivindique a GPU
# antes do driver proprietário. Baked na imagem em
# /usr/lib/modules.d ou /usr/lib/modprobe.d (ver o COPY no
# Containerfile) em vez de /etc, para sobreviver a um `bootc switch`
# sem depender do merge de /etc.
#
# NÃO VALIDADO: se o Dakota gerar a initrd/UKI embutindo o nouveau
# estaticamente (em vez de como módulo carregado sob demanda), este
# blacklist sozinho não é suficiente — verifique no primeiro boot
# (`lsmod | grep nouveau`, `dmesg | grep -i nouveau`) se ele ainda
# aparece antes do nvidia.ko.
blacklist nouveau
options nouveau modeset=0
