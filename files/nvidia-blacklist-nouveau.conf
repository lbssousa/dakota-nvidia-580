# Keeps nouveau (the in-tree open-source driver) from claiming the GPU
# before the proprietary driver does. Baked into the image under
# /usr/lib/modprobe.d (see the COPY in the Containerfile) instead of
# /etc, so it survives a `bootc switch` without depending on the /etc
# 3-way merge.
#
# NOT SUFFICIENT ON ITS OWN: nouveau claims the GPU before nvidia.ko
# ever loads — nouveau binds the PCI device during the initramfs/
# plymouth stage (`rhgb quiet` triggers early KMS), before this file
# under /usr/lib/modprobe.d is even consulted. nvidia.ko does get
# inserted later, but by then nouveau already owns the device, so it
# never actually probes the hardware (no NVRM messages in dmesg, no
# /dev/nvidia*). The real fix is the kernel command line — see
# files/nvidia-kargs.toml (`rd.driver.blacklist=nouveau`, which is
# honored inside the initramfs itself) baked in via
# /usr/lib/bootc/kargs.d/. This file is kept as defense-in-depth for
# any later manual/explicit `modprobe nouveau`.
blacklist nouveau
options nouveau modeset=0
