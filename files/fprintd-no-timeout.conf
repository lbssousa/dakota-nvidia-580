# Keeps fprintd resident instead of exiting after ~30-45s idle (its own
# internal timer, not systemd's — this is a drop-in override, not a
# patch, since fprintd itself isn't built by this repo, only the
# libfprint fork it loads).
#
# Why: on this image's Goodix 538d sensor, a *cold* fprintd (freshly
# D-Bus-activated after sitting idle) takes long enough to reopen/
# re-handshake the device that GNOME Shell's own fingerprint-verify
# timeout fires first — confirmed on real hardware via
# `journalctl -b -1`: dozens of
#   gnome-shell: Failed to start gdm-fingerprint verification for user:
#   Gio.IOErrorEnum: O tempo limite foi alcançado
# at almost exactly the 15-minute cadence GNOME Shell re-arms
# fingerprint auth while the screen is locked — every one of them a
# cold-start, since fprintd had already idle-exited between attempts.
#
# Each such timeout is itself one instance of a broader, separately
# confirmed problem: a D-Bus service-activation request that runs out
# its full service_start_timeout appears to leak the requester's
# connection slot on the system bus. Given enough uptime, this
# eventually exhausts UID 0's 256-connection cap there (also confirmed
# independently via uupd.service crash-looping with "The maximum
# number of active connections for UID 0 has been reached") — at which
# point *any* fresh root-owned process needing a new system-bus
# connection fails, including gdm-password, which builds the lock
# screen's password prompt. That's the actual mechanism behind the
# screen occasionally coming up with no password/fingerprint field at
# all, impossible to unlock.
#
# This drop-in doesn't fix that leak (out of scope — it's in
# dbus-broker/systemd, not this repo's code); it removes fingerprint
# re-arm as one of its most frequent, clockwork-regular triggers by
# keeping fprintd's device handshake already "warm", so verification
# starts fast enough to not time out in the first place. See
# README.md, "Known limitations".
[Service]
ExecStart=
ExecStart=/usr/libexec/fprintd --no-timeout
