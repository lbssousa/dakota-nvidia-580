name: Build and publish

# One workflow, two streams, distinguished by the ref it runs on —
# mirroring how upstream Dakota drives its own build.yml off the
# `testing` and `next` branches (see projectbluefin/dakota's
# build.yml/publish.yml, where publish.yml derives the stream tag from
# the head branch). GitHub Actions runs the workflow file *from the ref
# being built*, so `next` picks up its own copy of this file, its own
# base-image pins and its own IMAGE_TAG with no extra plumbing here.
#
#   main -> :testing   (what :stable is promoted from)
#   next -> :next      (upstream :next base, GNOME rolling master)
#
# Neither stream is ever built as :stable — that's a server-side retag
# of an already-published, already-signed digest, done by
# promote-stable.yml.

on:
  push:
    branches: [main, next]
  pull_request:
  schedule:
    # Daily at 13:00 UTC, matching upstream's own :testing build
    # schedule (projectbluefin/dakota build.yml) rather than the weekly
    # run this used to have. A schedule event always runs on the
    # repository's default branch, so this fires only for main -> :next
    # is driven by nightly-next-build.yml, which dispatches this
    # workflow with --ref next (upstream does the same, for the same
    # reason).
    #
    # This went daily for the first time; see the note below on what the
    # periodic run is actually for.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/lbssousa/dakota-nvidia-580

# Separate queue per stream so a :next build can't sit behind — or
# cancel — a :testing one. cancel-in-progress: false so a rebuild in
# flight is never killed by a new push; upstream's publish.yml groups
# its publish jobs the same way for the same reason.
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard variant — base pinned by the Containerfile's
          # BASE_IMAGE default, so no override is passed here.
          - variant: standard
            tag_suffix: ""
            base_arg_name: BASE_IMAGE
          # Gaming variant — mirrors the upstream dakota / dakota-gaming
          # split (Open Gaming Collective/OGC kernel). Reuses the same
          # Containerfile; only the base image + output tag differ.
          - variant: gaming
            tag_suffix: "-gaming"
            base_arg_name: BASE_IMAGE_GAMING
    steps:
      - uses: actions/checkout@v4

      # Which stream tag this run publishes. Derived from the ref, not
      # hardcoded, so the same workflow file works unchanged on both
      # branches. A pull_request run has neither `main` nor `next` as
      # its ref name (it's `<pr>/merge`), and lands on :testing — the
      # PR is only built for validation and never pushes, so the tag it
      # would have used is irrelevant beyond naming the local image.
      - name: Resolve stream tag
        id: stream
        run: |
          case "${GITHUB_REF_NAME}" in
            next) stream_tag=next ;;
            *)    stream_tag=testing ;;
          esac
          echo "stream_tag=${stream_tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing stream: :${stream_tag} (ref ${GITHUB_REF_NAME})"

      - name: Resolve base image for this variant
        id: base
        run: |
          base="$(sed -n "s/^ARG ${{ matrix.base_arg_name }}=//p" Containerfile | head -n1)"
          if [ -z "$base" ]; then
            echo "Could not find ARG ${{ matrix.base_arg_name }} in Containerfile" >&2
            exit 1
          fi
          echo "base_image=${base}" >> "$GITHUB_OUTPUT"

      - name: Build image (${{ matrix.variant }})
        run: |
          # IMAGE_NAME (the Containerfile ARG, not this job's env var of
          # the same name) is what gets baked into /etc/os-release and
          # image-info.json so `uwelcome` shows this image instead of
          # the upstream Dakota base — must match the repo name half of
          # the tag below. IMAGE_TAG is passed explicitly rather than
          # left to the Containerfile default so the image's
          # self-reported identity always matches the tag it is
          # published under, whichever branch is building.
          #
          # :stable is deliberately absent: it's a retag of an
          # already-signed :testing digest (promote-stable.yml), never a
          # build of its own, exactly as upstream does it.
          podman build \
            --file Containerfile \
            --build-arg "BASE_IMAGE=${{ steps.base.outputs.base_image }}" \
            --build-arg "IMAGE_NAME=dakota-nvidia-580${{ matrix.tag_suffix }}" \
            --build-arg "IMAGE_TAG=${{ steps.stream.outputs.stream_tag }}" \
            --tag "${IMAGE_NAME}${{ matrix.tag_suffix }}:${{ steps.stream.outputs.stream_tag }}" \
            .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          # cosign (via go-containerregistry) reads ~/.docker/config.json
          # for registry credentials, not podman's separate auth file.
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image (${{ matrix.variant }})
        if: github.event_name != 'pull_request'
        id: push
        run: |
          podman push --digestfile /tmp/push-digest \
            "${IMAGE_NAME}${{ matrix.tag_suffix }}:${{ steps.stream.outputs.stream_tag }}"
          echo "digest=$(cat /tmp/push-digest)" >> "$GITHUB_OUTPUT"

      # Signing and SBOM generation mirror lbssousa/bluefin's own
      # build.yml (cosign key-pair signing + syft/cosign attest, not
      # keyless/Fulcio — cosign.pub in the repo root is what a consumer
      # verifies against: `cosign verify --key cosign.pub <image>`).
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3

      - name: Sign image (${{ matrix.variant }})
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY --tlog-upload=false \
            "${IMAGE_NAME}${{ matrix.tag_suffix }}@${{ steps.push.outputs.digest }}"

      - name: Setup Syft
        if: github.event_name != 'pull_request'
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24

      - name: Generate SBOM (${{ matrix.variant }})
        if: github.event_name != 'pull_request'
        id: sbom
        run: |
          # Scans the pushed image straight from the registry (already
          # authenticated via the docker login above), rather than
          # mounting the local image -- the build/push steps run as the
          # unprivileged runner user, whose podman storage a `sudo
          # podman image mount` can't see.
          OUTPUT_PATH="$(mktemp -d)/sbom.spdx.json"
          ${{ steps.syft.outputs.cmd }} scan \
            "registry:${IMAGE_NAME}${{ matrix.tag_suffix }}@${{ steps.push.outputs.digest }}" \
            -o spdx-json="${OUTPUT_PATH}"
          echo "output_path=${OUTPUT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Attest SBOM (${{ matrix.variant }})
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest -y \
            --predicate "${{ steps.sbom.outputs.output_path }}" \
            --type spdxjson \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            "${IMAGE_NAME}${{ matrix.tag_suffix }}@${{ steps.push.outputs.digest }}"
