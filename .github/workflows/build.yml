name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Covers the case where Renovate already bumped the dakota:stable
    # digest (see renovate.json5) — without this, the NVIDIA kmod
    # would stay compiled against a stale kernel until someone opens a
    # manual push.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/lbssousa/dakota-nvidia-580

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          podman build \
            --file Containerfile \
            --tag "${IMAGE_NAME}:stable" \
            .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        run: podman push "${IMAGE_NAME}:stable"
