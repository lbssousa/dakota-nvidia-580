name: Nightly next build

# Dispatches build.yml on the `next` branch every night at 03:00 UTC,
# which publishes :next. This is the :next half of upstream Dakota's
# build cadence (projectbluefin/dakota's nightly-next-build.yml fires
# at the same 03:00 UTC and drives the same next-branch -> :next chain);
# the :testing half is build.yml's own daily 13:00 UTC schedule, which
# runs on the default branch.
#
# Why a separate workflow instead of a second `schedule:` entry in
# build.yml: GitHub schedule events ALWAYS run on the repository's
# default branch (main here) — a cron in build.yml physically cannot
# target `next`, and upstream hit the exact same wall. The dispatcher
# uses the `actions: write` token to start that run explicitly.
#
# Unlike upstream, this doesn't wait on any junction PR: the `next`
# branch here tracks upstream's *published :next image*, which upstream
# refreshes nightly at this same hour, so a dispatch now can in
# principle race upstream's own nightly build landing. If the base
# digest resolves before upstream's retag, :next simply carries the
# previous night's base for one cycle; renovate.json5 opens a PR
# against the `next` branch when the digest does move. That's a
# one-cycle delay on a bleeding-edge tag, not a correctness problem,
# and it avoids adding an hours-long wait to pick up the base.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Trigger next branch build
    runs-on: ubuntu-24.04
    steps:
      # Don't stack dispatches behind an in-flight build. Without this,
      # every nightly run queues another one whenever a build takes
      # longer than 24h, and they compound.
      - name: Check for active next build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --branch next \
            --status in_progress \
            --json databaseId \
            --jq 'length')
          queued=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --branch next \
            --status queued \
            --json databaseId \
            --jq 'length')
          total=$((active + queued))
          if [ "$total" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Next build already running or queued ($total run(s)) — skipping dispatch"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch build.yml on next
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref next
          echo "Build dispatched on next branch — publishes :next"